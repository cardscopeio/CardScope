<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Reset Password - CardScope.io</title>
    <script>(function(){var t=localStorage.getItem('cardscope_theme')||'dark';document.documentElement.setAttribute('data-theme',t);})();</script>
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="card-flip.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 100%);
            color: var(--text-1);
            min-height: 100vh;
        }

        header {
            background: var(--header-surface);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--tint-4);
            padding: 1.5rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo-subtitle {
            font-size: 0.75rem;
            color: var(--text-2);
            margin-top: -0.25rem;
        }

        nav {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        nav a {
            color: var(--text-2);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        nav a:hover,
        nav a.active {
            color: #667eea;
        }

        .container {
            max-width: 460px;
            margin: 0 auto;
            padding: 4rem 2rem;
        }

        .page-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .page-title {
            font-size: 2.25rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .page-subtitle {
            font-size: 1rem;
            color: var(--text-2);
        }

        .auth-form-container {
            background: var(--tint-1);
            border: 1px solid var(--tint-4);
            border-radius: 20px;
            padding: 2.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-1);
            font-weight: 600;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 1rem;
            background: var(--tint-2);
            border: 1px solid var(--tint-4);
            border-radius: 10px;
            color: var(--text-1);
            font-size: 1rem;
            transition: all 0.3s;
            font-family: inherit;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            background: var(--tint-3);
        }

        .input-hint {
            font-size: 0.85rem;
            color: var(--text-2);
            margin-top: 0.5rem;
        }

        .btn-submit {
            width: 100%;
            padding: 1.1rem 2rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 16px rgba(102, 126, 234, 0.3);
        }

        .btn-submit:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.4);
        }

        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #ef4444;
            padding: 0.85rem 1rem;
            border-radius: 10px;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            display: none;
        }

        .success-message {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.4);
            color: #22c55e;
            padding: 0.85rem 1rem;
            border-radius: 10px;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            display: none;
        }

        @media (max-width: 768px) {
            .container {
                padding: 2rem 1rem;
            }

            .auth-form-container {
                padding: 1.75rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <a href="index.html" style="text-decoration: none;">
                <div>
                    <div class="logo">CardScope.io</div>
                    <div class="logo-subtitle">Premium Baseball Card Marketplace</div>
                </div>
            </a>
            <nav>
                <a href="index.html">Browse</a>
                <a href="index.html?view=bargain">Bargain Box</a>
                <a href="sell-cards.html">Sell Cards</a>
                <a href="#about">About</a>
                <a href="contact.html">Contact</a>
                <button class="theme-toggle-btn" onclick="toggleTheme()" title="Toggle light/dark theme">☀️</button>
                <span id="authNavSlot"></span>
            </nav>
        </div>
    </header>

    <div class="container">
        <div class="page-header">
            <h1 class="page-title">Reset Password</h1>
            <p class="page-subtitle" id="pageSubtitle">Choose a new password for your account.</p>
        </div>

        <div class="auth-form-container">
            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>

            <form id="resetForm" onsubmit="handleReset(event)">
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" id="newPassword" required autocomplete="new-password" minlength="8">
                    <div class="input-hint">At least 8 characters</div>
                </div>
                <div class="form-group">
                    <label>Confirm New Password</label>
                    <input type="password" id="confirmPassword" required autocomplete="new-password" minlength="8">
                </div>
                <button type="submit" class="btn-submit" id="resetBtn">Reset Password</button>
            </form>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="cards-data.js"></script>
    <script>
        renderAuthNav();
        updateThemeToggleButtons();

        // The token comes from the emailed reset link (?token=...) - see
        // backend/app/main.py's forgot-password endpoint for how it's
        // generated and emailed. No token in the URL means this page was
        // opened directly rather than via a real reset email - the form is
        // useless without it, so disable it up front instead of letting
        // someone fill it out and hit a confusing error on submit.
        const RESET_TOKEN = new URLSearchParams(window.location.search).get('token');

        if (!RESET_TOKEN) {
            document.getElementById('pageSubtitle').textContent =
                'This link is missing its reset token - use the link from your password reset email.';
            document.getElementById('resetForm').style.display = 'none';
            document.getElementById('errorMessage').textContent =
                'No reset token found. Request a new reset link from the sign-in page.';
            document.getElementById('errorMessage').style.display = 'block';
        }

        async function handleReset(event) {
            event.preventDefault();
            document.getElementById('errorMessage').style.display = 'none';
            document.getElementById('successMessage').style.display = 'none';

            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (newPassword !== confirmPassword) {
                document.getElementById('errorMessage').textContent = 'Passwords don\'t match.';
                document.getElementById('errorMessage').style.display = 'block';
                return;
            }

            const btn = document.getElementById('resetBtn');
            btn.disabled = true;
            btn.textContent = 'Resetting...';

            try {
                await resetPassword(RESET_TOKEN, newPassword);
            } catch (err) {
                document.getElementById('errorMessage').textContent =
                    err.message || 'Could not reset your password. The link may have expired - request a new one.';
                document.getElementById('errorMessage').style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Reset Password';
                return;
            }

            // resetPassword() already saved the new session (see cards-data.js) -
            // the user just proved account ownership via the emailed link, so
            // they're logged in immediately rather than asked to sign in again.
            document.getElementById('successMessage').textContent =
                'Password reset! Taking you to your account...';
            document.getElementById('successMessage').style.display = 'block';
            document.getElementById('resetForm').style.display = 'none';
            setTimeout(() => { window.location.href = 'manage-cards.html'; }, 1500);
        }
    </script>
</body>
</html>
