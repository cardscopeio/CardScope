<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>My Cards - CardScope.io</title>
    <script>(function(){var t=localStorage.getItem('cardscope_theme')||'dark';document.documentElement.setAttribute('data-theme',t);})();</script>
    <link rel="stylesheet" href="theme.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 100%);
            color: var(--text-1);
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: var(--text-2);
            margin-bottom: 2rem;
        }

        .back-link {
            display: inline-block;
            color: #667eea;
            text-decoration: none;
            margin-bottom: 2rem;
            padding: 0.75rem 1.25rem;
            background: rgba(102, 126, 234, 0.1);
            border-radius: 8px;
            transition: all 0.3s;
        }

        .back-link:hover {
            background: rgba(102, 126, 234, 0.2);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--tint-2);
            border: 1px solid var(--tint-4);
            border-radius: 12px;
            padding: 1.5rem;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 0.5rem;
        }

        .stat-label {
            color: var(--text-2);
            font-size: 0.9rem;
        }

        .actions {
            margin-bottom: 2rem;
            display: flex;
            gap: 1rem;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-danger {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
        }

        .cards-list {
            background: var(--tint-1);
            border: 1px solid var(--tint-4);
            border-radius: 12px;
            overflow: hidden;
        }

        .card-item {
            padding: 1.5rem;
            border-bottom: 1px solid var(--tint-2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-item:last-child {
            border-bottom: none;
        }

        .card-info {
            flex: 1;
        }

        .card-player {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-1);
            margin-bottom: 0.25rem;
        }

        .card-details {
            color: var(--text-2);
            font-size: 0.9rem;
        }

        .card-price {
            font-size: 1.5rem;
            font-weight: 700;
            color: #667eea;
            margin: 0 2rem;
        }

        .btn-edit {
            padding: 0.5rem 1rem;
            background: rgba(102, 126, 234, 0.2);
            border: 1px solid rgba(102, 126, 234, 0.4);
            border-radius: 6px;
            color: #667eea;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            margin-right: 0.5rem;
            display: inline-block;
        }

        .btn-edit:hover {
            background: rgba(102, 126, 234, 0.3);
        }

        .btn-delete {
            padding: 0.5rem 1rem;
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.4);
            border-radius: 6px;
            color: #ef4444;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-delete:hover {
            background: rgba(239, 68, 68, 0.3);
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-2);
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }

            h1 {
                font-size: 2rem;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .card-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }

            .card-price {
                margin: 0;
            }

            .btn-delete {
                width: 100%;
            }

            .actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }

            .card-player {
                font-size: 1.1rem;
            }

            .card-details {
                font-size: 0.85rem;
            }

            .stat-value {
                font-size: 1.5rem;
            }
        }

        /* iPad specific */
        @media (min-width: 769px) and (max-width: 1024px) {
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* Improve touch targets for mobile */
        @media (hover: none) and (pointer: coarse) {
            .btn,
            .btn-delete,
            .back-link {
                min-height: 44px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">← Back to Homepage</a>
        <span id="authNavSlot" style="float: right; margin-top: 0.5rem;"></span>

        <h1>My Cards</h1>
        <p class="subtitle">View and manage the cards you've listed</p>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" id="userCardCount">0</div>
                <div class="stat-label">Your Listings</div>
            </div>
        </div>

        <div class="actions">
            <button class="btn btn-danger" onclick="clearAllMyCards()">Delete All My Listings</button>
        </div>

        <div class="cards-list" id="cardsList">
            <div class="empty-state">
                <div class="empty-state-icon">📦</div>
                <p>You haven't listed any cards yet</p>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="cards-data.js"></script>
    <script>
        renderAuthNav();
        updateThemeToggleButtons();

        // This page shows YOUR cards specifically - requires being signed in.
        if (!isLoggedIn()) {
            window.location.href = 'login.html?next=manage-cards.html';
        }

        let myCards = [];

        async function loadCards() {
            const cardsList = document.getElementById('cardsList');
            try {
                myCards = await fetchMyCards();
            } catch (err) {
                console.error(err);
                if (err instanceof AuthRequiredError) {
                    logout();
                    window.location.href = 'login.html?next=manage-cards.html';
                    return;
                }
                cardsList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">⚠️</div>
                        <p>Could not load your cards — is the CardScope backend running?</p>
                    </div>
                `;
                return;
            }

            document.getElementById('userCardCount').textContent = myCards.length;

            if (myCards.length === 0) {
                cardsList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📦</div>
                        <p>You haven't listed any cards yet</p>
                    </div>
                `;
                return;
            }

            cardsList.innerHTML = myCards.map((card) => `
                <div class="card-item">
                    <div class="card-info">
                        <div class="card-player">${card.player}</div>
                        <div class="card-details">${card.year} ${card.brand} • ${card.type} • ${card.condition || 'Ungraded'}</div>
                    </div>
                    <div class="card-price">${card.price}</div>
                    <a href="sell-cards.html?edit=${card.id}" class="btn-edit">Edit</a>
                    <button class="btn-delete" onclick="deleteCard('${card.id}')">Delete</button>
                </div>
            `).join('');
        }

        async function deleteCard(id) {
            if (!confirm('Are you sure you want to delete this card?')) {
                return;
            }
            try {
                await deleteCardById(id);
            } catch (err) {
                console.error(err);
                if (err instanceof AuthRequiredError) {
                    logout();
                    window.location.href = 'login.html?next=manage-cards.html';
                    return;
                }
                alert('Could not delete this card — is the CardScope backend running?');
                return;
            }
            loadCards();
        }

        async function clearAllMyCards() {
            if (!confirm('Are you sure you want to delete ALL of your listings? This cannot be undone.')) {
                return;
            }
            try {
                await Promise.all(myCards.map(card => deleteCardById(card.id)));
            } catch (err) {
                console.error(err);
                alert('Some cards may not have been deleted — is the CardScope backend running?');
            }
            loadCards();
            alert('All of your listings have been deleted.');
        }

        // Load cards on page load
        loadCards();
    </script>
</body>
</html>
