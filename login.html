<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Sign In - CardScope.io</title>
    <script>(function(){var t=localStorage.getItem('cardscope_theme')||'dark';document.documentElement.setAttribute('data-theme',t);})();</script>
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="card-flip.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 100%);
            color: var(--text-1);
            min-height: 100vh;
        }

        header {
            background: var(--header-surface);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--tint-4);
            padding: 1.5rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo-subtitle {
            font-size: 0.75rem;
            color: var(--text-2);
            margin-top: -0.25rem;
        }

        nav {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        nav a {
            color: var(--text-2);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        nav a:hover,
        nav a.active {
            color: #667eea;
        }

        .container {
            max-width: 460px;
            margin: 0 auto;
            padding: 4rem 2rem;
        }

        .page-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .page-title {
            font-size: 2.25rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .page-subtitle {
            font-size: 1rem;
            color: var(--text-2);
        }

        .auth-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 2rem;
        }

        .auth-tab {
            flex: 1;
            padding: 0.9rem;
            background: var(--tint-2);
            border: 1px solid var(--tint-4);
            border-radius: 10px;
            color: var(--text-2);
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            text-align: center;
        }

        .auth-tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-color: transparent;
            color: white;
        }

        .auth-form-container {
            background: var(--tint-1);
            border: 1px solid var(--tint-4);
            border-radius: 20px;
            padding: 2.5rem;
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-1);
            font-weight: 600;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 1rem;
            background: var(--tint-2);
            border: 1px solid var(--tint-4);
            border-radius: 10px;
            color: var(--text-1);
            font-size: 1rem;
            transition: all 0.3s;
            font-family: inherit;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            background: var(--tint-3);
        }

        .input-hint {
            font-size: 0.85rem;
            color: var(--text-2);
            margin-top: 0.5rem;
        }

        .btn-submit {
            width: 100%;
            padding: 1.1rem 2rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 16px rgba(102, 126, 234, 0.3);
        }

        .btn-submit:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.4);
        }

        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #ef4444;
            padding: 0.85rem 1rem;
            border-radius: 10px;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            display: none;
        }

        .success-message {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.4);
            color: #22c55e;
            padding: 0.85rem 1rem;
            border-radius: 10px;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            display: none;
        }

        @media (max-width: 768px) {
            .container {
                padding: 2rem 1rem;
            }

            .auth-form-container {
                padding: 1.75rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <a href="index.html" style="text-decoration: none;">
                <div>
                    <div class="logo">CardScope.io</div>
                    <div class="logo-subtitle">Premium Baseball Card Marketplace</div>
                </div>
            </a>
            <nav>
                <a href="index.html">Browse</a>
                <a href="index.html?view=bargain">Bargain Box</a>
                <a href="sell-cards.html">Sell Cards</a>
                <a href="#about">About</a>
                <a href="contact.html">Contact</a>
                <span id="authNavSlot"></span>
            </nav>
        </div>
    </header>

    <div class="container">
        <div class="page-header">
            <h1 class="page-title">Welcome</h1>
            <p class="page-subtitle">Sign in to manage your listings, or create an account to start selling.</p>
        </div>

        <div class="auth-tabs">
            <div class="auth-tab active" id="signInTab" onclick="switchTab('signin')">Sign In</div>
            <div class="auth-tab" id="signUpTab" onclick="switchTab('signup')">Sign Up</div>
        </div>

        <div class="auth-form-container">
            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>

            <form class="auth-form active" id="signInForm" onsubmit="handleSignIn(event)">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="signInEmail" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="signInPassword" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn-submit" id="signInBtn">Sign In</button>
                <p style="text-align: center; margin-top: 1rem;">
                    <a href="#" onclick="showForgotPassword(); return false;" style="color: #667eea; font-size: 0.9rem; text-decoration: none;">Forgot password?</a>
                </p>
            </form>

            <form class="auth-form" id="forgotPasswordForm" onsubmit="handleForgotPassword(event)">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="forgotEmail" required autocomplete="email">
                    <div class="input-hint">We'll email you a link to reset your password.</div>
                </div>
                <button type="submit" class="btn-submit" id="forgotBtn">Send Reset Link</button>
                <p style="text-align: center; margin-top: 1rem;">
                    <a href="#" onclick="switchTab('signin'); return false;" style="color: #667eea; font-size: 0.9rem; text-decoration: none;">Back to Sign In</a>
                </p>
            </form>

            <form class="auth-form" id="signUpForm" onsubmit="handleSignUp(event)">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="signUpEmail" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="signUpPassword" required autocomplete="new-password" minlength="8">
                    <div class="input-hint">At least 8 characters</div>
                </div>
                <button type="submit" class="btn-submit" id="signUpBtn">Create Account</button>
            </form>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="cards-data.js"></script>
    <script>
        renderAuthNav();
        updateThemeToggleButtons();

        // If already logged in, no reason to be on this page
        if (isLoggedIn()) {
            window.location.href = 'manage-cards.html';
        }

        function switchTab(tab) {
            document.getElementById('signInTab').classList.toggle('active', tab === 'signin');
            document.getElementById('signUpTab').classList.toggle('active', tab === 'signup');
            document.getElementById('signInForm').classList.toggle('active', tab === 'signin');
            document.getElementById('signUpForm').classList.toggle('active', tab === 'signup');
            document.getElementById('forgotPasswordForm').classList.remove('active');
            hideMessages();
        }

        function showForgotPassword() {
            document.getElementById('signInForm').classList.remove('active');
            document.getElementById('signUpForm').classList.remove('active');
            document.getElementById('forgotPasswordForm').classList.add('active');
            hideMessages();
        }

        function hideMessages() {
            document.getElementById('errorMessage').style.display = 'none';
            document.getElementById('successMessage').style.display = 'none';
        }

        function showError(msg) {
            const el = document.getElementById('errorMessage');
            el.textContent = msg;
            el.style.display = 'block';
            document.getElementById('successMessage').style.display = 'none';
        }

        // Where to send the user after a successful login/signup. If they
        // were redirected here from another page (e.g. sell-cards.html
        // requiring auth), send them back there.
        function redirectDestination() {
            const params = new URLSearchParams(window.location.search);
            return params.get('next') || 'manage-cards.html';
        }

        async function handleSignIn(event) {
            event.preventDefault();
            hideMessages();
            const btn = document.getElementById('signInBtn');
            btn.disabled = true;
            btn.textContent = 'Signing in...';
            try {
                await loginAccount(
                    document.getElementById('signInEmail').value,
                    document.getElementById('signInPassword').value
                );
                window.location.href = redirectDestination();
            } catch (err) {
                showError(err.message || 'Could not sign in.');
                btn.disabled = false;
                btn.textContent = 'Sign In';
            }
        }

        async function handleSignUp(event) {
            event.preventDefault();
            hideMessages();
            const btn = document.getElementById('signUpBtn');
            btn.disabled = true;
            btn.textContent = 'Creating account...';
            try {
                await registerAccount(
                    document.getElementById('signUpEmail').value,
                    document.getElementById('signUpPassword').value
                );
                window.location.href = redirectDestination();
            } catch (err) {
                showError(err.message || 'Could not create account.');
                btn.disabled = false;
                btn.textContent = 'Create Account';
            }
        }

        async function handleForgotPassword(event) {
            event.preventDefault();
            hideMessages();
            const btn = document.getElementById('forgotBtn');
            btn.disabled = true;
            btn.textContent = 'Sending...';
            try {
                const data = await forgotPassword(document.getElementById('forgotEmail').value);
                document.getElementById('successMessage').textContent =
                    data.message || 'If an account exists for that email, a reset link has been sent.';
                document.getElementById('successMessage').style.display = 'block';
                document.getElementById('forgotPasswordForm').reset();
            } catch (err) {
                showError(err.message || 'Could not send reset email.');
            }
            btn.disabled = false;
            btn.textContent = 'Send Reset Link';
        }
    </script>
</body>
</html>
