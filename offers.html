<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>My Offers - CardScope.io</title>
    <script>(function(){var t=localStorage.getItem('cardscope_theme')||'dark';document.documentElement.setAttribute('data-theme',t);})();</script>
    <link rel="stylesheet" href="theme.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 100%);
            color: var(--text-1);
            min-height: 100vh;
        }

        header {
            background: var(--header-surface);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--tint-4);
            padding: 1.5rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo-subtitle {
            font-size: 0.75rem;
            color: var(--text-2);
            margin-top: -0.25rem;
        }

        nav {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        nav a {
            color: var(--text-2);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        nav a:hover,
        nav a.active {
            color: #667eea;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: var(--text-2);
            margin-bottom: 2rem;
        }

        .tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 2rem;
        }

        .tab {
            flex: 1;
            padding: 0.9rem;
            background: var(--tint-2);
            border: 1px solid var(--tint-4);
            border-radius: 10px;
            color: var(--text-2);
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            text-align: center;
        }

        .tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-color: transparent;
            color: white;
        }

        .offers-list {
            background: var(--tint-1);
            border: 1px solid var(--tint-4);
            border-radius: 12px;
            overflow: hidden;
        }

        .offer-item {
            padding: 1.5rem;
            border-bottom: 1px solid var(--tint-2);
        }

        .offer-item:last-child {
            border-bottom: none;
        }

        .offer-top-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1rem;
            margin-bottom: 0.75rem;
        }

        .offer-card-link {
            color: #667eea;
            font-weight: 700;
            font-size: 1.1rem;
            text-decoration: none;
        }

        .offer-card-link:hover {
            text-decoration: underline;
        }

        .offer-amount {
            font-size: 1.25rem;
            font-weight: 700;
            color: #667eea;
            white-space: nowrap;
        }

        .offer-message {
            color: var(--text-3);
            line-height: 1.5;
            margin-bottom: 0.75rem;
        }

        .offer-meta-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        .offer-date {
            color: var(--text-2);
            font-size: 0.85rem;
        }

        .offer-status {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .offer-status.pending {
            background: rgba(255, 193, 7, 0.2);
            color: var(--amber-text-alt);
        }

        .offer-status.accepted {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
        }

        .offer-status.declined {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .offer-actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn-accept, .btn-decline {
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.3s;
            border: 1px solid transparent;
        }

        .btn-accept {
            background: rgba(34, 197, 94, 0.2);
            border-color: rgba(34, 197, 94, 0.4);
            color: #22c55e;
        }

        .btn-accept:hover {
            background: rgba(34, 197, 94, 0.3);
        }

        .btn-decline {
            background: rgba(239, 68, 68, 0.2);
            border-color: rgba(239, 68, 68, 0.4);
            color: #ef4444;
        }

        .btn-decline:hover {
            background: rgba(239, 68, 68, 0.3);
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-2);
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        .lot-tag {
            display: inline-block;
            padding: 0.2rem 0.6rem;
            background: rgba(245, 158, 11, 0.2);
            color: var(--amber-text);
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-right: 0.5rem;
            vertical-align: middle;
        }

        .lot-card-list {
            color: var(--text-2);
            font-size: 0.85rem;
            margin-bottom: 0.5rem;
        }

        .lot-price-detail {
            color: var(--text-2);
            font-size: 0.8rem;
            margin-top: 0.2rem;
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }

            nav {
                gap: 1rem;
                flex-wrap: wrap;
            }

            .header-content {
                flex-direction: column;
                gap: 1rem;
                align-items: flex-start;
            }

            nav a {
                font-size: 0.9rem;
            }

            .logo {
                font-size: 1.5rem;
            }

            header {
                padding: 1rem;
            }

            h1 {
                font-size: 2rem;
            }

            .offer-top-row {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <a href="index.html" style="text-decoration: none;">
                <div>
                    <div class="logo">CardScope.io</div>
                    <div class="logo-subtitle">Premium Baseball Card Marketplace</div>
                </div>
            </a>
            <nav>
                <a href="index.html">Browse</a>
                <a href="index.html?view=bargain">Bargain Box</a>
                <a href="sell-cards.html">Sell Cards</a>
                <a href="#about">About</a>
                <a href="contact.html">Contact</a>
                <span id="authNavSlot"></span>
            </nav>
        </div>
    </header>

    <div class="container">
        <h1>My Offers</h1>
        <p class="subtitle">Offers and messages on your listings, plus offers you've sent — including Bargain Box lot offers</p>

        <div class="tabs">
            <div class="tab active" id="receivedTab" onclick="switchTab('received')">Received</div>
            <div class="tab" id="sentTab" onclick="switchTab('sent')">Sent</div>
        </div>

        <div class="offers-list" id="offersList">
            <div class="empty-state">
                <div class="empty-state-icon">📭</div>
                <p>Loading...</p>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="cards-data.js"></script>
    <script>
        if (!isLoggedIn()) {
            window.location.href = 'login.html?next=offers.html';
        }
        renderAuthNav();
        updateThemeToggleButtons();

        let currentTab = 'received';
        let receivedOffers = [];
        let sentOffers = [];

        function formatDate(isoString) {
            try {
                const d = new Date(isoString.replace(' ', 'T') + 'Z');
                return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
            } catch {
                return isoString;
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('receivedTab').classList.toggle('active', tab === 'received');
            document.getElementById('sentTab').classList.toggle('active', tab === 'sent');
            render();
        }

        function render() {
            const list = document.getElementById('offersList');
            const offers = currentTab === 'received' ? receivedOffers : sentOffers;

            if (offers.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <p>${currentTab === 'received' ? 'No offers on your listings yet' : "You haven't sent any offers yet"}</p>
                    </div>
                `;
                return;
            }

            list.innerHTML = offers.map((offer) => {
                if (offer.kind === 'lot') {
                    return `
                    <div class="offer-item">
                        <div class="offer-top-row">
                            <div>
                                <span class="lot-tag">📦 ${offer.cardSlugs.length}-CARD LOT</span>
                            </div>
                            <div class="offer-amount">${offer.amount}</div>
                        </div>
                        <div class="lot-card-list">${offer.cardSlugs.map(s => s.replace(/-/g, ' ')).join(', ')}</div>
                        <div class="offer-message">${offer.message || '(no message)'}</div>
                        <div class="lot-price-detail">List price ${offer.totalListPrice} • offer is ${offer.percentOfList}% of list</div>
                        <div class="offer-meta-row">
                            <div>
                                <span class="offer-status ${offer.status}">${offer.status}</span>
                                <span class="offer-date">${formatDate(offer.createdAt)}</span>
                            </div>
                            ${currentTab === 'received' && offer.status === 'pending' ? `
                                <div class="offer-actions">
                                    <button class="btn-accept" onclick="respond('${offer.id}', 'accepted', 'lot')">Accept</button>
                                    <button class="btn-decline" onclick="respond('${offer.id}', 'declined', 'lot')">Decline</button>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;
                }
                return `
                <div class="offer-item">
                    <div class="offer-top-row">
                        <a href="card.html?card=${offer.cardSlug}" class="offer-card-link">${offer.cardSlug.replace(/-/g, ' ')}</a>
                        ${offer.amount ? `<div class="offer-amount">${offer.amount}</div>` : ''}
                    </div>
                    <div class="offer-message">${offer.message}</div>
                    <div class="offer-meta-row">
                        <div>
                            <span class="offer-status ${offer.status}">${offer.status}</span>
                            <span class="offer-date">${formatDate(offer.createdAt)}</span>
                        </div>
                        ${currentTab === 'received' && offer.status === 'pending' ? `
                            <div class="offer-actions">
                                <button class="btn-accept" onclick="respond('${offer.id}', 'accepted', 'single')">Accept</button>
                                <button class="btn-decline" onclick="respond('${offer.id}', 'declined', 'single')">Decline</button>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;
            }).join('');
        }

        async function respond(offerId, status, kind) {
            try {
                if (kind === 'lot') {
                    await respondToLotOffer(offerId, status);
                } else {
                    await respondToOffer(offerId, status);
                }
            } catch (err) {
                console.error(err);
                if (err instanceof AuthRequiredError) {
                    logout();
                    window.location.href = 'login.html?next=offers.html';
                    return;
                }
                alert('Could not update this offer — is the CardScope backend running?');
                return;
            }
            loadOffers();
        }

        async function loadOffers() {
            try {
                const [singleReceived, singleSent, lotReceived, lotSent] = await Promise.all([
                    fetchOffersReceived(),
                    fetchOffersSent(),
                    fetchLotOffersReceived(),
                    fetchLotOffersSent(),
                ]);
                receivedOffers = [
                    ...singleReceived.map(o => ({ ...o, kind: 'single' })),
                    ...lotReceived.map(o => ({ ...o, kind: 'lot' })),
                ].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
                sentOffers = [
                    ...singleSent.map(o => ({ ...o, kind: 'single' })),
                    ...lotSent.map(o => ({ ...o, kind: 'lot' })),
                ].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
            } catch (err) {
                console.error(err);
                if (err instanceof AuthRequiredError) {
                    logout();
                    window.location.href = 'login.html?next=offers.html';
                    return;
                }
                document.getElementById('offersList').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">⚠️</div>
                        <p>Could not load offers — is the CardScope backend running?</p>
                    </div>
                `;
                return;
            }
            render();
        }

        loadOffers();
    </script>
</body>
</html>
