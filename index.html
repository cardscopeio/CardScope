<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>CardScope - Premium Sports Cards Marketplace</title>
    <script>(function(){var t=localStorage.getItem('cardscope_theme')||'dark';document.documentElement.setAttribute('data-theme',t);})();</script>
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="card-flip.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 100%);
            color: var(--text-1);
            min-height: 100vh;
        }

        header {
            background: var(--header-surface);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--tint-4);
            padding: 1.5rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo-subtitle {
            font-size: 0.75rem;
            color: var(--text-2);
            margin-top: -0.25rem;
        }

        nav {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        nav a {
            color: var(--text-2);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        nav a:hover {
            color: #667eea;
        }

        .search-bar {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        .search-input {
            width: 100%;
            padding: 1rem 1.5rem;
            background: var(--tint-2);
            border: 1px solid var(--tint-4);
            border-radius: 12px;
            color: var(--text-1);
            font-size: 1rem;
            transition: all 0.3s;
        }

        .search-input:focus {
            outline: none;
            border-color: #667eea;
            background: var(--tint-3);
        }

        .search-input::placeholder {
            color: var(--text-2);
        }

        .filters {
            max-width: 1400px;
            margin: 0 auto 2rem;
            padding: 0 2rem;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .cards-header {
            max-width: 1400px;
            margin: 0 auto 1.5rem;
            padding: 0 2rem;
            color: var(--text-2);
            font-size: 0.95rem;
        }

        .cards-header .highlight {
            color: #22c55e;
            font-weight: 600;
        }

        .filter-btn {
            padding: 0.75rem 1.5rem;
            background: var(--tint-2);
            border: 1px solid var(--tint-4);
            border-radius: 8px;
            color: var(--text-2);
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .filter-btn:hover {
            background: rgba(102, 126, 234, 0.1);
            border-color: #667eea;
            color: #667eea;
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-color: transparent;
            color: white;
        }

        .cards-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 2rem 4rem;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
        }

        .card {
            background: var(--tint-1);
            border: 1px solid var(--tint-4);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.3s;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: #667eea;
            box-shadow: 0 20px 40px rgba(102, 126, 234, 0.2);
        }

        .card-image {
            width: 100%;
            aspect-ratio: 2.5 / 3.5;
            background: linear-gradient(135deg, #667eea20 0%, #764ba220 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            position: relative;
            overflow: hidden;
        }

        .card-image::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent 0%, rgba(102, 126, 234, 0.1) 100%);
        }

        .new-badge {
            position: absolute;
            top: 0.75rem;
            right: 0.75rem;
            padding: 0.25rem 0.75rem;
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: white;
            font-size: 0.7rem;
            font-weight: 700;
            border-radius: 6px;
            letter-spacing: 0.5px;
            box-shadow: 0 2px 8px rgba(34, 197, 94, 0.4);
            animation: newBadgePulse 2s ease-in-out infinite;
        }

        .lot-badge {
            position: absolute;
            top: 0.75rem;
            left: 0.75rem;
            padding: 0.25rem 0.75rem;
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: white;
            font-size: 0.7rem;
            font-weight: 700;
            border-radius: 6px;
            letter-spacing: 0.5px;
            box-shadow: 0 2px 8px rgba(245, 158, 11, 0.4);
        }

        /* Bargain Box lot-builder: select multiple individual cards to
           propose one combined offer for the group. */
        .lot-select-overlay {
            position: absolute;
            top: 0.75rem;
            right: 0.75rem;
            z-index: 2;
        }

        .lot-select-overlay input[type="checkbox"] {
            width: 22px;
            height: 22px;
            cursor: pointer;
            accent-color: #f59e0b;
        }

        .lot-selected {
            outline: 2px solid #f59e0b;
            outline-offset: -1px;
        }

        .lot-builder-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 200;
            background: rgba(15, 20, 25, 0.97);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(245, 158, 11, 0.4);
            padding: 1rem 2rem;
            display: none;
        }

        .lot-builder-bar.visible {
            display: block;
        }

        .lot-builder-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .lot-builder-summary {
            color: var(--text-1);
            font-size: 0.95rem;
        }

        .lot-builder-summary strong {
            color: #f59e0b;
        }

        .lot-builder-actions {
            display: flex;
            gap: 0.75rem;
        }

        .btn-lot-clear {
            padding: 0.75rem 1.25rem;
            background: var(--tint-2);
            border: 1px solid var(--tint-4);
            border-radius: 8px;
            color: var(--text-2);
            cursor: pointer;
            font-weight: 600;
        }

        .btn-lot-propose {
            padding: 0.75rem 1.5rem;
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-weight: 700;
        }

        .lot-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 300;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .lot-modal-overlay.visible {
            display: flex;
        }

        .lot-modal {
            background: var(--panel-bg);
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: 16px;
            padding: 2rem;
            max-width: 480px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
        }

        .lot-modal h3 {
            font-size: 1.3rem;
            margin-bottom: 1rem;
            color: var(--amber-text);
        }

        .lot-modal-cardlist {
            font-size: 0.9rem;
            color: var(--text-3);
            margin-bottom: 1rem;
            line-height: 1.6;
        }

        .lot-modal-totals {
            background: rgba(245, 158, 11, 0.08);
            border: 1px solid rgba(245, 158, 11, 0.25);
            border-radius: 10px;
            padding: 1rem;
            margin-bottom: 1.25rem;
            font-size: 0.9rem;
            color: var(--text-1);
        }

        .lot-modal-totals div {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.35rem;
        }

        .lot-modal-totals div:last-child {
            margin-bottom: 0;
            font-weight: 700;
            color: var(--amber-text);
        }

        .lot-modal label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-1);
        }

        .lot-modal input,
        .lot-modal textarea {
            width: 100%;
            padding: 0.85rem;
            background: var(--tint-2);
            border: 1px solid var(--tint-4);
            border-radius: 10px;
            color: var(--text-1);
            font-size: 1rem;
            font-family: inherit;
            margin-bottom: 1rem;
        }

        .lot-modal textarea {
            min-height: 80px;
            resize: vertical;
        }

        .lot-modal-error {
            color: #ef4444;
            font-size: 0.85rem;
            margin: -0.5rem 0 1rem;
            display: none;
        }

        .lot-modal-buttons {
            display: flex;
            gap: 0.75rem;
        }

        .lot-modal-buttons button {
            flex: 1;
            padding: 0.9rem;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            border: none;
        }

        .lot-modal-cancel {
            background: var(--tint-2);
            border: 1px solid var(--tint-4) !important;
            color: var(--text-2);
        }

        .lot-modal-submit {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: white;
        }

        .lot-modal-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        @keyframes newBadgePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .card-content {
            padding: 1.5rem;
        }

        .card-player {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-1);
            margin-bottom: 0.5rem;
        }

        .card-details {
            color: var(--text-2);
            font-size: 0.9rem;
            margin-bottom: 0.75rem;
        }

        .card-year {
            display: inline-block;
            background: rgba(102, 126, 234, 0.2);
            padding: 0.25rem 0.75rem;
            border-radius: 6px;
            font-size: 0.8rem;
            color: #667eea;
            margin-bottom: 0.75rem;
        }

        .card-price {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-top: 1rem;
        }

        .card-condition {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-top: 0.5rem;
        }

        @media (max-width: 768px) {
            .cards-container {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 1rem;
                padding: 0 1rem 2rem;
            }

            .filters {
                padding: 0 1rem;
                gap: 0.5rem;
            }

            .filter-btn {
                font-size: 0.85rem;
                padding: 0.6rem 1rem;
            }

            .search-bar {
                padding: 0 1rem;
            }

            header {
                padding: 1rem;
            }

            .header-content {
                flex-direction: column;
                gap: 1rem;
                align-items: flex-start;
            }

            nav {
                gap: 1rem;
                width: 100%;
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }

            nav a {
                white-space: nowrap;
                font-size: 0.9rem;
            }

            .logo {
                font-size: 1.5rem;
            }

            .card-player {
                font-size: 1rem;
            }

            .card-details {
                font-size: 0.8rem;
            }

            .card-price {
                font-size: 1.25rem;
            }

            .card-year {
                font-size: 0.7rem;
                padding: 0.2rem 0.6rem;
            }

            .card-condition {
                font-size: 0.65rem;
                padding: 0.2rem 0.6rem;
            }

            .cards-header {
                padding: 0 1rem;
                font-size: 0.85rem;
            }
        }

        /* iPad specific */
        @media (min-width: 769px) and (max-width: 1024px) {
            .cards-container {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 1.5rem;
            }

            .header-content {
                padding: 0 1rem;
            }
        }

        /* Improve touch targets for mobile */
        @media (hover: none) and (pointer: coarse) {
            .card {
                min-height: 280px;
            }

            .filter-btn,
            nav a {
                min-height: 44px;
                display: inline-flex;
                align-items: center;
                justify-content: center;
            }
        }

        /* Prevent zoom on input focus (iOS) */
        @media screen and (max-width: 768px) {
            input[type="text"],
            input[type="search"] {
                font-size: 16px !important;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <a href="index.html" style="text-decoration: none;">
                <div>
                    <div class="logo">CardScope.io</div>
                    <div class="logo-subtitle">Premium Baseball Card Marketplace</div>
                </div>
            </a>
            <nav>
                <a href="index.html">Browse</a>
                <a href="index.html?view=bargain">Bargain Box</a>
                <a href="sell-cards.html">Sell Cards</a>
                <a href="#about">About</a>
                <a href="contact.html">Contact</a>
                <span id="authNavSlot"></span>
            </nav>
        </div>
    </header>

    <div class="search-bar">
        <input type="text" class="search-input" placeholder="Search by player, team, year, set, or card type..." id="searchInput">
    </div>

    <div class="filters">
        <button class="filter-btn active" data-filter="all">All Cards</button>
        <button class="filter-btn" data-filter="rookie">Rookie Cards</button>
        <button class="filter-btn" data-filter="vintage">Vintage</button>
        <button class="filter-btn" data-filter="modern">Modern</button>
        <button class="filter-btn" data-filter="graded">Graded</button>
        <button class="filter-btn" data-filter="autograph">Autographs</button>
        <button class="filter-btn" data-filter="bargain">Bargain Box</button>
    </div>

    <div class="cards-header" id="cardsHeader"></div>

    <div class="cards-container" id="cardsContainer"></div>

    <!-- Bargain Box lot builder: appears once 2+ cards are checked -->
    <div class="lot-builder-bar" id="lotBuilderBar">
        <div class="lot-builder-content">
            <div class="lot-builder-summary" id="lotBuilderSummary"></div>
            <div class="lot-builder-actions">
                <button class="btn-lot-clear" onclick="clearLotSelection()">Clear</button>
                <button class="btn-lot-propose" id="lotProposeBtn" onclick="openLotOfferModal()">Propose Lot Offer</button>
            </div>
        </div>
    </div>

    <div class="lot-modal-overlay" id="lotModalOverlay">
        <div class="lot-modal">
            <h3>📦 Propose a Lot Offer</h3>
            <div class="lot-modal-cardlist" id="lotModalCardList"></div>
            <div class="lot-modal-totals">
                <div><span>Combined list price</span><span id="lotModalTotal">-</span></div>
                <div><span>Minimum offer (80%)</span><span id="lotModalMin">-</span></div>
            </div>
            <form id="lotOfferForm" onsubmit="submitLotOffer(event)">
                <label>Your Offer (whole lot, not per card)</label>
                <div class="price-input-wrapper" style="position: relative;">
                    <span class="currency-symbol" style="position:absolute;left:1rem;top:50%;transform:translateY(-50%);color:var(--text-2);">$</span>
                    <input type="number" id="lotOfferAmount" min="1" step="1" style="padding-left: 2.5rem;" required>
                </div>
                <div class="lot-modal-error" id="lotModalError"></div>
                <label>Message to Seller</label>
                <textarea id="lotOfferMessage" placeholder="Introduce your offer, e.g. why you're bundling these..."></textarea>
                <div class="lot-modal-buttons">
                    <button type="button" class="lot-modal-cancel" onclick="closeLotOfferModal()">Cancel</button>
                    <button type="submit" class="lot-modal-submit" id="lotOfferSubmitBtn">Send Offer</button>
                </div>
            </form>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="cards-data.js"></script>
    <script>
        // Card data now comes from the backend API (see cards-data.js) so
        // every visitor sees the same live listings, not just their own
        // browser's localStorage.
        let cardsData = [];

        let currentFilter = 'all';
        let searchTerm = '';

        // Bargain Box lot builder state - a Map of cardId -> card object for
        // whatever's currently checked, so the floating bar/modal can total
        // prices without re-fetching. Cleared on submit or explicit Clear.
        let lotSelection = new Map();

        // The lot most recently saved via POST /api/lots for the current
        // selection - an offer is always made against this saved lot's id,
        // never built directly from the raw card list (see cards-data.js).
        let currentSavedLot = null;

        function toggleLotSelect(cardId, checked) {
            const card = cardsData.find(c => c.id === cardId);
            if (!card) return;
            if (checked) {
                lotSelection.set(cardId, card);
            } else {
                lotSelection.delete(cardId);
            }
            updateLotBuilderBar();
            renderCards();
        }

        function clearLotSelection() {
            lotSelection.clear();
            currentSavedLot = null;
            updateLotBuilderBar();
            renderCards();
        }

        // Lot totals/min are dollar-string fields on a saved lot (e.g.
        // "$3,200.00") - reuses the same parsing approach as lotPriceCents
        // above since the backend formats them the same way.
        function dollarStringToCents(str) {
            return Math.round(parseFloat((str || '0').replace(/[^0-9.]/g, '')) * 100);
        }

        function lotPriceCents(card) {
            // card.price is a formatted string like "$2,750" or "$1,930.50"
            return Math.round(parseFloat((card.price || '0').replace(/[^0-9.]/g, '')) * 100);
        }

        function formatCents(cents) {
            const dollars = cents / 100;
            return dollars === Math.round(dollars) ? `$${dollars.toLocaleString()}` : `$${dollars.toFixed(2)}`;
        }

        function lotTotals() {
            const cards = Array.from(lotSelection.values());
            const totalCents = cards.reduce((sum, c) => sum + lotPriceCents(c), 0);
            const minCents = Math.round(totalCents * LOT_OFFER_MIN_FRACTION);
            return { cards, totalCents, minCents };
        }

        function updateLotBuilderBar() {
            const bar = document.getElementById('lotBuilderBar');
            const { cards, totalCents, minCents } = lotTotals();

            if (cards.length < 2) {
                bar.classList.remove('visible');
                return;
            }

            bar.classList.add('visible');
            document.getElementById('lotBuilderSummary').innerHTML =
                `<strong>${cards.length} cards</strong> selected • Combined list price <strong>${formatCents(totalCents)}</strong> • Minimum lot offer (80%) <strong>${formatCents(minCents)}</strong>`;
        }

        async function openLotOfferModal() {
            if (!isLoggedIn()) {
                window.location.href = 'login.html?next=' + encodeURIComponent('index.html?view=bargain');
                return;
            }
            const { cards } = lotTotals();
            if (cards.length < 2) return;

            // Save the selection as a real lot FIRST - an offer is always
            // made against a saved lot's id, never built directly from the
            // raw card list. This also gives us server-confirmed totals
            // (current prices, re-validated same-seller) instead of trusting
            // whatever the client happened to compute from cached cardsData.
            const proposeBtn = document.getElementById('lotProposeBtn');
            proposeBtn.disabled = true;
            proposeBtn.textContent = 'Saving lot...';

            try {
                currentSavedLot = await saveLot(cards.map(c => c.id));
            } catch (err) {
                console.error(err);
                if (err instanceof AuthRequiredError) {
                    alert('Your session expired — please sign in again.');
                    logout();
                    window.location.href = 'login.html?next=' + encodeURIComponent('index.html?view=bargain');
                    return;
                }
                alert(err.message || 'Could not save this lot. Please try again.');
                proposeBtn.disabled = false;
                proposeBtn.textContent = 'Propose Lot Offer';
                return;
            }

            proposeBtn.disabled = false;
            proposeBtn.textContent = 'Propose Lot Offer';

            const totalCents = dollarStringToCents(currentSavedLot.totalListPrice);
            const minCents = dollarStringToCents(currentSavedLot.minLotOffer);

            document.getElementById('lotModalCardList').innerHTML =
                cards.map(c => `• ${c.player} (${c.year}) — ${c.price}`).join('<br>');
            document.getElementById('lotModalTotal').textContent = formatCents(totalCents);
            document.getElementById('lotModalMin').textContent = formatCents(minCents);
            document.getElementById('lotOfferAmount').min = Math.ceil(minCents / 100);
            document.getElementById('lotOfferAmount').value = Math.ceil(minCents / 100);
            document.getElementById('lotModalError').style.display = 'none';
            document.getElementById('lotModalOverlay').classList.add('visible');
        }

        function closeLotOfferModal() {
            document.getElementById('lotModalOverlay').classList.remove('visible');
        }

        async function submitLotOffer(event) {
            event.preventDefault();
            const errorEl = document.getElementById('lotModalError');
            errorEl.style.display = 'none';

            if (!currentSavedLot) {
                errorEl.textContent = 'This lot wasn\'t saved properly - close this and try again.';
                errorEl.style.display = 'block';
                return;
            }

            const minCents = dollarStringToCents(currentSavedLot.minLotOffer);
            const amountRaw = parseFloat(document.getElementById('lotOfferAmount').value);
            if (!amountRaw || Math.round(amountRaw * 100) < minCents) {
                errorEl.textContent = `Offer must be at least ${formatCents(minCents)} (80% of the combined list price) — sellers won't see anything lower.`;
                errorEl.style.display = 'block';
                return;
            }

            const submitBtn = document.getElementById('lotOfferSubmitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Sending...';

            try {
                await makeLotOffer(currentSavedLot.id, {
                    amount: amountRaw,
                    message: document.getElementById('lotOfferMessage').value,
                });
            } catch (err) {
                console.error(err);
                if (err instanceof AuthRequiredError) {
                    alert('Your session expired — please sign in again.');
                    logout();
                    window.location.href = 'login.html?next=' + encodeURIComponent('index.html?view=bargain');
                    return;
                }
                errorEl.textContent = err.message || 'Could not send your lot offer. Please try again.';
                errorEl.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Send Offer';
                return;
            }

            alert('✓ Sent! The seller will see your lot offer in their offers inbox and can accept or decline it.');
            closeLotOfferModal();
            clearLotSelection();
            submitBtn.disabled = false;
            submitBtn.textContent = 'Send Offer';
        }

        function renderCards() {
            const container = document.getElementById('cardsContainer');
            const header = document.getElementById('cardsHeader');
            let filteredCards = cardsData;

            if (currentFilter !== 'all') {
                if (currentFilter === 'rookie') {
                    filteredCards = filteredCards.filter(card => card.type.toLowerCase().includes('rookie'));
                } else if (currentFilter === 'graded') {
                    filteredCards = filteredCards.filter(card => card.condition);
                } else if (currentFilter === 'autograph') {
                    filteredCards = filteredCards.filter(card => card.type.toLowerCase().includes('autograph'));
                } else if (currentFilter === 'vintage') {
                    filteredCards = filteredCards.filter(card => card.era === 'vintage');
                } else if (currentFilter === 'modern') {
                    filteredCards = filteredCards.filter(card => card.era === 'modern');
                } else if (currentFilter === 'bargain') {
                    // Bargain Box shows everything: pre-built lots (already
                    // isBargainBox) AND every individual card, since
                    // individual cards are exactly what gets checked off to
                    // build an ad-hoc lot offer below.
                    filteredCards = filteredCards;
                }
            }

            if (searchTerm) {
                filteredCards = filteredCards.filter(card => 
                    card.player.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    card.brand.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    card.year.includes(searchTerm) ||
                    card.type.toLowerCase().includes(searchTerm.toLowerCase())
                );
            }

            // Update header
            const userCardCount = cardsData.filter(card => card.isUserSubmitted).length;
            if (currentFilter === 'bargain') {
                header.innerHTML = `Check the box on any card below to build your own lot, or browse pre-built lots • <span class="highlight">${filteredCards.filter(c => c.isBargainBox).length} pre-built lot${filteredCards.filter(c => c.isBargainBox).length === 1 ? '' : 's'} listed</span>`;
            } else if (userCardCount > 0) {
                header.innerHTML = `Showing ${filteredCards.length} cards • <span class="highlight">${userCardCount} new user listing${userCardCount > 1 ? 's' : ''}</span>`;
            } else {
                header.innerHTML = `Showing ${filteredCards.length} cards`;
            }

            container.innerHTML = filteredCards.map((card) => {
                const eligibleForLot = currentFilter === 'bargain' && !card.isBargainBox &&
                    !(isLoggedIn() && card.userId === getAuthUserId());
                const isSelected = lotSelection.has(card.id);
                return `
                <div class="card ${isSelected ? 'lot-selected' : ''}" onclick="viewCard('${card.id}')">
                    <div class="card-image">
                        ${cardImageMarkup(card, '3rem')}
                        ${card.isBargainBox ? `<span class="lot-badge">${card.lotCardCount ? card.lotCardCount + '-CARD LOT' : 'LOT'}</span>` : ''}
                        ${card.isUserSubmitted ? '<span class="new-badge">NEW</span>' : ''}
                        ${eligibleForLot ? `
                            <span class="lot-select-overlay" onclick="event.stopPropagation()">
                                <input type="checkbox" title="Add to lot" ${isSelected ? 'checked' : ''}
                                    onchange="toggleLotSelect('${card.id}', this.checked)">
                            </span>
                        ` : ''}
                    </div>
                    <div class="card-content">
                        <div class="card-player">${card.player}</div>
                        <div class="card-details">${card.brand} • ${card.type}</div>
                        <span class="card-year">${card.year}</span>
                        ${card.condition ? `<span class="card-condition">${card.condition}</span>` : ''}
                        <div class="card-price">${card.price}</div>
                    </div>
                </div>
            `;
            }).join('');
            initCardFlipTouchSupport(container);
        }

        function viewCard(id) {
            window.location.href = `card.html?card=${id}`;
        }

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentFilter = this.dataset.filter;
                renderCards();
            });
        });

        document.getElementById('searchInput').addEventListener('input', function(e) {
            searchTerm = e.target.value;
            renderCards();
        });

        async function init() {
            const header = document.getElementById('cardsHeader');
            header.innerHTML = 'Loading cards…';

            // Support linking straight into the Bargain Box view (e.g. from
            // the nav link) via index.html?view=bargain.
            const requestedView = new URLSearchParams(window.location.search).get('view');
            if (requestedView === 'bargain') {
                currentFilter = 'bargain';
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                const bargainBtn = document.querySelector('.filter-btn[data-filter="bargain"]');
                if (bargainBtn) bargainBtn.classList.add('active');
            }

            try {
                cardsData = await fetchAllCards();
            } catch (err) {
                console.error(err);
                header.innerHTML = 'Could not load cards — is the CardScope backend running?';
                cardsData = [];
                return;
            }
            renderCards();
        }

        init();
        renderAuthNav();
        updateThemeToggleButtons();
    </script>
</body>
</html>
